services:
  - type: web
    name: druk-health-appointments
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install-all && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: druk-health-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: 07240063.sherubtse@rub.edu.bt
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: druk-health-db
    databaseName: druk_health
    user: druk_health
    plan: free
    region: oregon
